[/Script/Engine.GameUserSettings]
; The kiosk renders at 30 fps. A packaged build applies GameUserSettings at
; startup, and its FrameRateLimit (engine default 0 = uncapped) overwrites the
; t.MaxFPS=30 in DefaultEngine.ini - UEngine::SetMaxFPS reuses the previous
; setter's priority. Measured: uncapped (~134-167 fps) the kiosk leaks ~15 MB/hour
; in the EngineMisc tag of Unreal's Low-Level Memory tracker (LLM) and holds the
; render GPU at 86-98%; capped at 30 there is no leak and the GPU
; sits near 21%.
FrameRateLimit=30.000000
