# ============================================================================
# 3DHumanAvatar - installation settings
#
# Edit this file to match your kiosk's hardware. Measurements are in inches
# unless noted. The values below are an example setup: a 34-inch ultrawide
# monitor with a Logitech C920 webcam clipped to its top edge.
# ============================================================================

[camera]
# Webcam field of view and capture settings (C920: 78 degrees diagonal).
fov_diagonal_deg = 78.0
capture_width = 1280
capture_height = 720
target_fps = 10

# Camera lens position relative to the monitor's viewable area.
# offset_from_left: from the LEFT edge of the viewable area to the lens center.
# offset_above_top: from the TOP edge of the viewable area to the lens center
#                   (positive = above the monitor).
offset_from_left = 17.0
offset_above_top = 1.5

# How far the camera is tilted DOWN toward the visitor, in degrees (0 = level).
tilt_down_deg = 0.0
# true only if the camera driver delivers a mirror image.
mirrored = false

[monitor]
# Physical viewable area of the display (not including the bezel).
viewable_width = 32.0
viewable_height = 13.3

# Height from the floor to the BOTTOM edge of the viewable area
# (desk height + stand height + bezel).
bottom_from_floor = 48.0

[avatar]
# Her name: used in her prompt and greetings.
name = Kiah
# Where her eyes are on the screen.
#   auto   - Unreal reports where it draws her eyes; the face box below is
#            used only until that report arrives.
#   config - always use the face box / overrides below.
eye_position = auto

# Bounding box of her face on screen, measured from the bottom-left corner of
# the viewable area. Adjust whenever the Unreal camera or level layout changes.
face_left = 14.0
face_right = 17.5
face_chin = 5.0
face_top = 10.0

# Eye position is derived automatically:
#   eye_x = midpoint of face_left and face_right
#   eye_y = face_chin + 57.5% of (face_top - face_chin)
# Override here if needed:
# eye_x_override =
# eye_y_override =

# Her voice is delayed this long (ms) on its way to the speakers so it lines up
# with her lips. It also delays the start of each reply. 0 = off. Saved changes
# apply within 2 seconds.
voice_delay_ms = 75

[tracking]
# Average human interpupillary distance in millimeters, used to estimate the
# visitor's distance from the camera. 63 mm is the adult average.
reference_ipd_mm = 63.0

# MediaPipe landmark indices for the left/right iris centers.
left_iris_index = 468
right_iris_index = 473

# Smoothing for the gaze output (exponential moving average).
# 0.0 = no smoothing, 1.0 = frozen. 0.3-0.5 looks natural.
gaze_smoothing = 0.4

# The visitor is followed up to this far to the side / up or down (degrees,
# measured from her eyes on the screen).
max_yaw_deg = 35.0
max_pitch_deg = 25.0

# Her eyes aim into the camera that films her (on a flat screen, that reads as
# looking at you from anywhere in front of it), then turn this share of the
# visitor's angle toward them.
#   0    = never turn
#   1.0  = full window geometry (on a flat screen this looks past people
#          standing off to the side)
# Saved changes apply within 2 seconds.
follow_gain_yaw = 0.25
follow_gain_pitch = 0.25

# Where the follow is zero, so her eyes go straight into the camera:
#   spot = a visitor at the standing spot, directly in front of the camera,
#          with their eyes spot_below_camera_in inches below the lens
#   eyes = a visitor straight out from her eyes on the screen
follow_center = spot
spot_below_camera_in = 1.6

# Small correction added to where she looks while looking at someone, in
# degrees (+ = her left / up). Use it if her eyes seem slightly off.
trim_yaw_deg = 0.0
trim_pitch_deg = 0.0

[glances]
# She glances away now and then and looks back; steady eye contact while she
# talks. "a-b" = a random value between a and b. Saved changes apply within
# seconds.
enabled = true
# while the visitor talks (seconds between glances, seconds held)
listening_every_s = 7-14
listening_hold_s = 0.5-1.2
# someone is there and nobody is talking
quiet_every_s = 4-9
quiet_hold_s = 0.8-2.0
# while she prepares an answer: chance of a glance up and aside until she speaks
thinking_chance = 0.5
thinking_hold_s = 0.6-1.6
# while she talks: 0 = steady eye contact
speaking_every_s = 0
speaking_hold_s = 0.4-0.8
# how far she glances, in degrees (her head turns about a third of it)
size_deg = 7-13

[identity]
# How she decides who she is talking to.
#   multi_user  - public kiosk (default): face recognition, name + PIN
#                 sign-in, a separate memory per person, anonymous chat allowed.
#   single_user - one person, e.g. at home: no recognition, no questions, no
#                 name, never signed out. One memory of its own, kept apart
#                 from every multi-user profile; no face data is processed.
# Face recognition and memory store personal data: see "Responsible use" in
# the README before using multi_user anywhere public.
mode = multi_user

[kb]
# Knowledge base read into her instructions at startup (the whole folder goes
# into her context). With enabled = true she loads the folder in path, or, if
# path is empty, the first folder holding text files (.md .txt .csv) on a
# removable drive. A knowledge base over ~210K tokens is refused. Takes effect
# at the next orchestrator restart.
enabled = false
path =
# Check how her voice says the knowledge base's names and fix the ones it gets
# wrong (orchestrator/pronunciation.py; needs the phoneme model, see SETUP.md).
# Runs in the background only while nobody is at the kiosk.
pronunciation_check = false
